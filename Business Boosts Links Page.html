<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Boosts</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #121821;
    --accent: #2f8fd6;
    --text: #f2f2f2;
    --muted: #9aa4af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a2230 0%, var(--bg) 70%);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .logo-img {
    width: 100%;
    max-width: 300px;
    margin-bottom: 8px;
  }
  .tagline {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 32px;
  }
  .link-btn {
    display: block;
    background: var(--card);
    border: 1px solid #22303f;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .link-btn small {
    display: block;
    color: var(--muted);
    font-weight: 400;
    font-size: 13px;
    margin-top: 4px;
  }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
